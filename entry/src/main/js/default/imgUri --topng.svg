<svg xmlns="http://www.w3.org/2000/svg" width="456" height="68" viewBox="0 0 456 68">
  <defs>
    <linearGradient id="paper-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef4fc"/>
      <stop offset="100%" stop-color="#b9cbe4"/>
    </linearGradient>
    <linearGradient id="paper-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fa9ca"/>
      <stop offset="100%" stop-color="#dbe7f6"/>
    </linearGradient>
    <linearGradient id="check-stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#17a34a"/>
      <stop offset="55%" stop-color="#34d17a"/>
      <stop offset="100%" stop-color="#71eda4"/>
    </linearGradient>
  </defs>
  <!-- 投影 -->
  <path d="M14 10 H37 L53 26 V62 H14 Z" fill="#0b1a2a" opacity="0.22"/>
  <!-- 纸张主体 -->
  <path d="M12 8 H36 L52 24 V60 H12 Z" fill="url(#paper-fill)"/>
  <!-- 折角 -->
  <path d="M36 8 L52 24 H36 Z" fill="url(#paper-fold)"/>
  <!-- 纸张内高光 -->
  <path d="M12 8 H36 L52 24 V60 H12 Z" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.5"/>
  <!-- 绿色打钩：暗底 + 渐变主体，与纸张的投影/高光处理一致 -->
  <path d="M22 37 L29 44 L43 29" fill="none" stroke="#0d5f2c" stroke-opacity="0.55" stroke-width="6.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 37 L29 44 L43 29" fill="none" stroke="url(#check-stroke)" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="51" font-family="HarmonyOS Sans" font-size="48px" font-weight="400" letter-spacing="0.5" fill="#ffffff" fill-opacity="0.5">js/</text>
</svg>
